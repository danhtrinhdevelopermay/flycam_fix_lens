<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lens Distortion Video Export</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
.container{max-width:900px;margin:auto}
canvas{max-width:100%;border-radius:12px;margin-top:15px;background:#000}
.controls{margin-top:20px;background:#1e293b;padding:15px;border-radius:12px}
input[type=range]{width:100%}
button{margin-top:10px;padding:10px 18px;border:none;border-radius:8px;background:#22c55e;color:white;cursor:pointer}
.progress{
  width:100%;
  height:20px;
  background:#334155;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}
.progress-bar{
  height:100%;
  width:0%;
  background:#22c55e;
  text-align:center;
  font-size:12px;
  line-height:20px;
}
</style>
</head>
<body>

<div class="container">
  <h2>Export Video với Progress</h2>

  <input type="file" id="upload" accept="video/*">
  <video id="video" style="display:none"></video>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <label>Distortion</label>
    <input type="range" id="distortion" min="-1" max="1" step="0.01" value="0">

    <label>Zoom</label>
    <input type="range" id="zoom" min="1" max="2" step="0.01" value="1">

    <button onclick="exportVideo()">Export video</button>

    <div class="progress">
      <div class="progress-bar" id="progressBar">0%</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");
const progressBar = document.getElementById("progressBar");

let distortion = 0;
let zoom = 1;

document.getElementById("upload").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  video.src = URL.createObjectURL(file);
});

video.onloadeddata = ()=>{
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
};

document.getElementById("distortion").oninput = e=>{
  distortion = parseFloat(e.target.value);
};

document.getElementById("zoom").oninput = e=>{
  zoom = parseFloat(e.target.value);
};

function applyDistortion(){
  const w = canvas.width;
  const h = canvas.height;

  ctx.drawImage(video,0,0,w,h);
  const src = ctx.getImageData(0,0,w,h);
  const dst = ctx.createImageData(w,h);

  const cx = w/2;
  const cy = h/2;

  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){

      let nx = (x - cx) / cx;
      let ny = (y - cy) / cy;
      let r = Math.sqrt(nx*nx + ny*ny);
      let factor = 1 + distortion * (r*r);

      let sx = cx + nx * factor * cx / zoom;
      let sy = cy + ny * factor * cy / zoom;

      let ix = Math.floor(sx);
      let iy = Math.floor(sy);

      let dstIndex = (y*w + x)*4;

      if(ix>=0 && iy>=0 && ix<w && iy<h){
        let srcIndex = (iy*w + ix)*4;
        dst.data[dstIndex]   = src.data[srcIndex];
        dst.data[dstIndex+1] = src.data[srcIndex+1];
        dst.data[dstIndex+2] = src.data[srcIndex+2];
        dst.data[dstIndex+3] = 255;
      }
    }
  }

  ctx.putImageData(dst,0,0);
}

async function exportVideo(){
  if(!video.src){
    alert("Upload video trước");
    return;
  }

  progressBar.style.width = "0%";
  progressBar.innerText = "0%";

  const stream = canvas.captureStream(30);
  const recorder = new MediaRecorder(stream, {mimeType:"video/webm"});
  let chunks = [];

  recorder.ondataavailable = e=>chunks.push(e.data);
  recorder.start();

  video.currentTime = 0;

  video.play();

  function render(){
    if(video.paused || video.ended) return;

    applyDistortion();

    // 🔹 cập nhật progress %
    let percent = (video.currentTime / video.duration) * 100;
    progressBar.style.width = percent.toFixed(1) + "%";
    progressBar.innerText = percent.toFixed(1) + "%";

    requestAnimationFrame(render);
  }

  video.onplay = render;

  video.onended = ()=>{
    recorder.stop();
  };

  recorder.onstop = ()=>{
    const blob = new Blob(chunks, {type:"video/webm"});
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "lens_corrected.webm";
    a.click();

    progressBar.style.width = "100%";
    progressBar.innerText = "Hoàn tất";
  };
}
</script>

</body>
</html>
