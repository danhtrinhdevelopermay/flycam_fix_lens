<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lens Distortion Editor Pro</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}
.container{max-width:950px;margin:auto}
canvas{max-width:100%;border-radius:12px;margin-top:15px;background:#000}
video{max-width:100%;margin-top:10px}
.controls{margin-top:20px;background:#1e293b;padding:15px;border-radius:12px}
.row{display:flex;align-items:center;gap:8px;margin-top:10px}
input[type=range]{flex:1}
input[type=number]{width:90px;padding:5px;border-radius:6px;border:none}
button{padding:8px 12px;border:none;border-radius:8px;background:#22c55e;color:white;cursor:pointer}
.progress{width:100%;height:20px;background:#334155;border-radius:10px;margin-top:10px;overflow:hidden}
.progress-bar{height:100%;width:0%;background:#22c55e;font-size:12px;line-height:20px}
</style>
</head>
<body>

<div class="container">
<h2>Lens Distortion Editor Pro</h2>

<input type="file" id="upload" accept="image/*,video/*">

<video id="video" controls style="display:none"></video>
<canvas id="canvas"></canvas>

<div class="controls">

<label>Distortion</label>
<div class="row">
<button onclick="step('distortion',-0.001)">-</button>
<input type="range" id="distortion" min="-1" max="1" step="0.0001">
<button onclick="step('distortion',0.001)">+</button>
<input type="number" id="distortionNum" step="0.0001">
</div>

<label>Zoom</label>
<div class="row">
<button onclick="step('zoom',-0.001)">-</button>
<input type="range" id="zoom" min="1" max="2" step="0.0001">
<button onclick="step('zoom',0.001)">+</button>
<input type="number" id="zoomNum" step="0.0001">
</div>

<button onclick="savePreset()">💾 Lưu preset</button>
<button onclick="resetPreset()">Reset</button>
<button onclick="downloadImage()">Download ảnh</button>
<button onclick="exportVideo()">Export video</button>

<div class="progress">
<div class="progress-bar" id="progressBar">0%</div>
</div>

</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("video");
const progressBar = document.getElementById("progressBar");

let img = new Image();
let isVideo = false;
let animationId = null;

let distortion = 0;
let zoom = 1;

//// 🔹 LOAD PRESET
const saved = JSON.parse(localStorage.getItem("lensPreset"));
if(saved){
  distortion = saved.distortion;
  zoom = saved.zoom;
}

const distortionSlider = document.getElementById("distortion");
const zoomSlider = document.getElementById("zoom");
const distortionNum = document.getElementById("distortionNum");
const zoomNum = document.getElementById("zoomNum");

function syncInputs(){
  distortionSlider.value = distortion;
  distortionNum.value = distortion.toFixed(4);
  zoomSlider.value = zoom;
  zoomNum.value = zoom.toFixed(4);
}

syncInputs();

//// 🔹 UPLOAD
document.getElementById("upload").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;

  cancelAnimationFrame(animationId);

  const url = URL.createObjectURL(file);

  if(file.type.startsWith("video")){
    isVideo = true;
    video.src = url;
    video.style.display = "block";
    img.src = "";
  }else{
    isVideo = false;
    video.style.display = "none";
    img.src = url;
  }
});

img.onload = ()=>{
  canvas.width = img.width;
  canvas.height = img.height;
  renderImage();
};

video.onloadeddata = ()=>{
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  video.pause();
  renderVideoFrame();
};

video.onplay = renderVideoLoop;
video.onpause = ()=>cancelAnimationFrame(animationId);
video.onended = ()=>cancelAnimationFrame(animationId);

//// 🔹 PRECISION SLIDER
function precisionValue(delta,e){
  if(e.shiftKey) return delta*0.1;
  if(e.ctrlKey) return delta*0.02;
  return delta;
}

distortionSlider.addEventListener("input",e=>{
  let delta = e.target.value - distortion;
  distortion += precisionValue(delta,e);
  distortion = +distortion.toFixed(4);
  syncInputs();
  renderCurrent();
});

zoomSlider.addEventListener("input",e=>{
  let delta = e.target.value - zoom;
  zoom += precisionValue(delta,e);
  zoom = +zoom.toFixed(4);
  syncInputs();
  renderCurrent();
});

distortionNum.onchange=()=>{
  distortion = +parseFloat(distortionNum.value).toFixed(4);
  syncInputs();
  renderCurrent();
};

zoomNum.onchange=()=>{
  zoom = +parseFloat(zoomNum.value).toFixed(4);
  syncInputs();
  renderCurrent();
};

function step(type,amount){
  if(type==="distortion"){
    distortion = +(distortion+amount).toFixed(4);
  }else{
    zoom = +(zoom+amount).toFixed(4);
  }
  syncInputs();
  renderCurrent();
}

//// 🔹 DISTORTION CORE
function applyDistortion(){
  const w = canvas.width;
  const h = canvas.height;

  const src = ctx.getImageData(0,0,w,h);
  const dst = ctx.createImageData(w,h);

  const cx = w/2;
  const cy = h/2;

  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){

      let nx = (x - cx) / cx;
      let ny = (y - cy) / cy;
      let r = Math.sqrt(nx*nx + ny*ny);
      let factor = 1 + distortion * (r*r);

      let sx = cx + nx * factor * cx / zoom;
      let sy = cy + ny * factor * cy / zoom;

      let ix = Math.floor(sx);
      let iy = Math.floor(sy);

      let dstIndex = (y*w + x)*4;

      if(ix>=0 && iy>=0 && ix<w && iy<h){
        let srcIndex = (iy*w + ix)*4;
        dst.data[dstIndex]   = src.data[srcIndex];
        dst.data[dstIndex+1] = src.data[srcIndex+1];
        dst.data[dstIndex+2] = src.data[srcIndex+2];
        dst.data[dstIndex+3] = 255;
      }
    }
  }

  ctx.putImageData(dst,0,0);
}

//// 🔹 RENDER
function renderImage(){
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  applyDistortion();
}

function renderVideoFrame(){
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  applyDistortion();
}

function renderVideoLoop(){
  renderVideoFrame();
  animationId = requestAnimationFrame(renderVideoLoop);
}

function renderCurrent(){
  if(isVideo) renderVideoFrame();
  else renderImage();
}

//// 🔹 PRESET
function savePreset(){
  localStorage.setItem("lensPreset",JSON.stringify({distortion,zoom}));
  alert("Đã lưu preset");
}

function resetPreset(){
  distortion = 0;
  zoom = 1;
  localStorage.removeItem("lensPreset");
  syncInputs();
  renderCurrent();
}

//// 🔹 DOWNLOAD IMAGE
function downloadImage(){
  if(isVideo){
    alert("Đang ở chế độ video");
    return;
  }
  const link = document.createElement("a");
  link.download = "lens_corrected.png";
  link.href = canvas.toDataURL();
  link.click();
}

//// 🔹 EXPORT VIDEO
async function exportVideo(){
  if(!isVideo){
    alert("Upload video trước");
    return;
  }

  progressBar.style.width="0%";
  progressBar.innerText="0%";

  const stream = canvas.captureStream(30);
  const recorder = new MediaRecorder(stream,{mimeType:"video/webm"});
  let chunks=[];

  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.start();

  video.currentTime=0;
  video.play();

  function render(){
    if(video.paused || video.ended) return;

    renderVideoFrame();

    let percent=(video.currentTime/video.duration)*100;
    progressBar.style.width=percent.toFixed(1)+"%";
    progressBar.innerText=percent.toFixed(1)+"%";

    requestAnimationFrame(render);
  }

  video.onplay=render;

  video.onended=()=>recorder.stop();

  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:"video/webm"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="lens_corrected.webm";
    a.click();

    progressBar.style.width="100%";
    progressBar.innerText="Hoàn tất";
  };
}
</script>
</body>
</html>
