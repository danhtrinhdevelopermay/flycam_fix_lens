<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lens Fix Preview OK</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;text-align:center}
canvas{max-width:95%;margin-top:10px;border-radius:10px}
button{padding:10px 18px;margin:6px;border-radius:8px;border:none;background:#0af;color:#000;font-weight:bold}
input[type=range]{width:300px}
</style>
</head>
<body>

<h3>Lens Distortion Fix – Preview OK</h3>

<input type="file" id="fileInput" accept="video/*,image/*"><br>
<button id="startBtn" disabled>Bắt đầu preview</button>

<video id="video" muted playsinline style="display:none"></video>
<canvas id="canvas"></canvas>

<br>
K1 <input type="range" id="k1" min="-1" max="1" step="0.001" value="0">
K2 <input type="range" id="k2" min="-1" max="1" step="0.001" value="0">
Scale <input type="range" id="scale" min="0.5" max="1.5" step="0.001" value="1">

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const k1 = document.getElementById('k1');
const k2 = document.getElementById('k2');
const scale = document.getElementById('scale');

const startBtn = document.getElementById('startBtn');

let isVideo = false;
let previewRunning = false;

document.getElementById('fileInput').onchange = e=>{
const file = e.target.files[0];
if(!file)return;

isVideo = file.type.startsWith('video');

if(isVideo){
video.src = URL.createObjectURL(file);
video.load();

video.onloadeddata = ()=>{
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;
startBtn.disabled = false;
};
}else{
const img = new Image();
img.onload = ()=>{
canvas.width = img.width;
canvas.height = img.height;
ctx.drawImage(img,0,0);
};
img.src = URL.createObjectURL(file);
}
};

startBtn.onclick = ()=>{
video.currentTime = 0;
video.play();
previewRunning = true;
previewLoop();
};

function distortPixel(x,y,w,h){
let nx=(x-w/2)/(w/2);
let ny=(y-h/2)/(h/2);
let r2=nx*nx+ny*ny;
let factor=1+k1.value*r2+k2.value*r2*r2;
nx*=factor*scale.value;
ny*=factor*scale.value;
return [nx*(w/2)+w/2,ny*(h/2)+h/2];
}

function renderFrame(){
ctx.drawImage(video,0,0);

const src = ctx.getImageData(0,0,canvas.width,canvas.height);
const dst = ctx.createImageData(canvas.width,canvas.height);

for(let y=0;y<canvas.height;y++){
for(let x=0;x<canvas.width;x++){
let [sx,sy]=distortPixel(x,y,canvas.width,canvas.height);
sx=Math.floor(sx);
sy=Math.floor(sy);

if(sx>=0&&sy>=0&&sx<canvas.width&&sy<canvas.height){
let si=(sy*canvas.width+sx)*4;
let di=(y*canvas.width+x)*4;
dst.data[di]=src.data[si];
dst.data[di+1]=src.data[si+1];
dst.data[di+2]=src.data[si+2];
dst.data[di+3]=255;
}
}
}
ctx.putImageData(dst,0,0);
}

function previewLoop(){
if(!previewRunning)return;

if(video.readyState >= 2){
renderFrame();
}

requestAnimationFrame(previewLoop);
}
</script>
</body>
</html>
