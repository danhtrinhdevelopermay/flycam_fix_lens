<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lens Distortion Editor Pro</title>
<style>
body{
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:20px;
}
.container{max-width:900px;margin:auto;}
canvas{max-width:100%;border-radius:12px;margin-top:15px;background:#000;}
.controls{margin-top:20px;background:#1e293b;padding:15px;border-radius:12px;}
.row{display:flex;align-items:center;gap:10px;margin-top:10px;}
input[type=range]{flex:1;}
input[type=number]{width:80px;padding:6px;border-radius:6px;border:none;}
button.small{padding:6px 10px;font-size:14px;}
button.main{
  margin-top:10px;padding:10px 18px;border:none;border-radius:8px;
  background:#22c55e;color:white;font-size:16px;cursor:pointer;
}
button.main:hover{background:#16a34a;}
button.secondary{
  background:#334155;
}
</style>
</head>
<body>

<div class="container">
  <h1>Lens Distortion Editor Pro</h1>

  <input type="file" id="upload" accept="image/*">
  <canvas id="canvas"></canvas>

  <div class="controls">

    <label>Distortion</label>
    <div class="row">
      <button class="small" onclick="step('distortion', -0.01)">-</button>
      <input type="range" id="distortion" min="-1" max="1" step="0.001">
      <button class="small" onclick="step('distortion', 0.01)">+</button>
      <input type="number" id="distortionNum" step="0.001">
    </div>

    <label>Zoom</label>
    <div class="row">
      <button class="small" onclick="step('zoom', -0.01)">-</button>
      <input type="range" id="zoom" min="1" max="2" step="0.001">
      <button class="small" onclick="step('zoom', 0.01)">+</button>
      <input type="number" id="zoomNum" step="0.001">
    </div>

    <button class="main" onclick="savePreset()">💾 Lưu thông số</button>
    <button class="main secondary" onclick="resetPreset()">Reset</button>
    <button class="main" onclick="download()">Download ảnh</button>

  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();
let previewImg = document.createElement("canvas");

let distortion = 0;
let zoom = 1;
let needsRender = false;

const distortionSlider = document.getElementById("distortion");
const zoomSlider = document.getElementById("zoom");
const distortionNum = document.getElementById("distortionNum");
const zoomNum = document.getElementById("zoomNum");

//// 🔹 LOAD PRESET
const saved = JSON.parse(localStorage.getItem("lensPreset"));
if(saved){
  distortion = saved.distortion;
  zoom = saved.zoom;
}

function syncInputs(){
  distortionSlider.value = distortion;
  distortionNum.value = distortion.toFixed(3);
  zoomSlider.value = zoom;
  zoomNum.value = zoom.toFixed(3);
}

document.getElementById("upload").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  img.src = URL.createObjectURL(file);
});

img.onload = ()=>{
  const scale = Math.min(800 / img.width, 800 / img.height, 1);
  previewImg.width = img.width * scale;
  previewImg.height = img.height * scale;

  previewImg.getContext("2d").drawImage(img, 0, 0, previewImg.width, previewImg.height);

  canvas.width = previewImg.width;
  canvas.height = previewImg.height;

  renderPreview();
};

distortionSlider.oninput = ()=>{
  distortion = parseFloat(distortionSlider.value);
  syncInputs();
  scheduleRender();
};

zoomSlider.oninput = ()=>{
  zoom = parseFloat(zoomSlider.value);
  syncInputs();
  scheduleRender();
};

distortionNum.onchange = ()=>{
  distortion = parseFloat(distortionNum.value);
  syncInputs();
  scheduleRender();
};

zoomNum.onchange = ()=>{
  zoom = parseFloat(zoomNum.value);
  syncInputs();
  scheduleRender();
};

function step(type, amount){
  if(type === "distortion"){
    distortion = +(distortion + amount).toFixed(3);
  }else{
    zoom = +(zoom + amount).toFixed(3);
  }
  syncInputs();
  scheduleRender();
}

//// 🔹 SAVE PRESET
function savePreset(){
  localStorage.setItem("lensPreset", JSON.stringify({distortion, zoom}));
  alert("Đã lưu thông số!");
}

//// 🔹 RESET PRESET
function resetPreset(){
  distortion = 0;
  zoom = 1;
  localStorage.removeItem("lensPreset");
  syncInputs();
  scheduleRender();
}

function scheduleRender(){
  if(!needsRender){
    needsRender = true;
    requestAnimationFrame(()=>{
      renderPreview();
      needsRender = false;
    });
  }
}

function renderPreview(){
  const w = previewImg.width;
  const h = previewImg.height;

  const srcCtx = previewImg.getContext("2d");
  const src = srcCtx.getImageData(0,0,w,h);
  const dst = ctx.createImageData(w,h);

  const cx = w/2;
  const cy = h/2;

  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      let nx = (x - cx) / cx;
      let ny = (y - cy) / cy;

      let r = Math.sqrt(nx*nx + ny*ny);
      let factor = 1 + distortion * (r*r);

      let sx = cx + nx * factor * cx / zoom;
      let sy = cy + ny * factor * cy / zoom;

      let ix = Math.floor(sx);
      let iy = Math.floor(sy);

      let dstIndex = (y*w + x)*4;

      if(ix>=0 && iy>=0 && ix<w && iy<h){
        let srcIndex = (iy*w + ix)*4;
        dst.data[dstIndex]   = src.data[srcIndex];
        dst.data[dstIndex+1] = src.data[srcIndex+1];
        dst.data[dstIndex+2] = src.data[srcIndex+2];
        dst.data[dstIndex+3] = 255;
      }
    }
  }

  ctx.putImageData(dst,0,0);
}

function download(){
  const link = document.createElement("a");
  link.download = "lens_corrected.png";
  link.href = canvas.toDataURL();
  link.click();
}

syncInputs();
</script>

</body>
</html>
