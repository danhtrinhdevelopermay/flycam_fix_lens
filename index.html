<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lens Distortion Fix PRO</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;text-align:center}
canvas{max-width:95vw;border:1px solid #444;margin-top:10px}
.controls{max-width:900px;margin:auto;text-align:left}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
input[type=range]{flex:1}
input[type=number]{width:90px}
button{padding:6px 10px;background:#333;color:#fff;border:0;border-radius:6px}
.progress{width:100%;height:10px;background:#333;margin-top:10px;border-radius:6px;overflow:hidden}
.bar{height:100%;width:0;background:#0f0}
</style>
</head>
<body>

<h2>Lens Distortion Fix PRO</h2>
<input type="file" id="upload" accept="image/*,video/*"><br>

<video id="video" style="display:none" muted playsinline></video>
<canvas id="canvas"></canvas>

<div class="controls">

<label>Distortion</label>
<div class="row">
<button onclick="step('distortion',-0.001)">-</button>
<input type="range" id="distortion" min="-1" max="1" step="0.0001">
<button onclick="step('distortion',0.001)">+</button>
<input type="number" id="distortionNum" step="0.0001">
</div>

<label>Zoom</label>
<div class="row">
<button onclick="step('zoom',-0.001)">-</button>
<input type="range" id="zoom" min="1" max="2" step="0.0001">
<button onclick="step('zoom',0.001)">+</button>
<input type="number" id="zoomNum" step="0.0001">
</div>

<button onclick="savePreset()">💾 Lưu preset</button>
<button onclick="loadPreset()">📂 Load preset</button>
<button onclick="exportImage()">📸 Export ảnh</button>
<button onclick="exportVideo()">🎬 Export video</button>

<div class="progress"><div class="bar" id="bar"></div></div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const video=document.getElementById("video");

const distortionSlider=document.getElementById("distortion");
const zoomSlider=document.getElementById("zoom");
const distortionNum=document.getElementById("distortionNum");
const zoomNum=document.getElementById("zoomNum");
const bar=document.getElementById("bar");

let distortion=-0.28;
let zoom=1.12;
let isVideo=false;
let originalFPS=30;
let sourceImage=null;

function sync(){
distortionSlider.value=distortion;
zoomSlider.value=zoom;
distortionNum.value=distortion.toFixed(4);
zoomNum.value=zoom.toFixed(4);
}
sync();

function step(type,val){
if(type==="distortion") distortion=+(distortion+val).toFixed(4);
else zoom=+(zoom+val).toFixed(4);
sync(); draw();
}

function precision(delta,e){
if(e.shiftKey) return delta*0.1;
if(e.ctrlKey) return delta*0.02;
return delta;
}

distortionSlider.oninput=e=>{
let delta=e.target.value-distortion;
distortion+=precision(delta,e);
distortion=+distortion.toFixed(4);
sync(); scheduleDraw();
};

zoomSlider.oninput=e=>{
let delta=e.target.value-zoom;
zoom+=precision(delta,e);
zoom=+zoom.toFixed(4);
sync(); scheduleDraw();
};

distortionNum.onchange=()=>{distortion=parseFloat(distortionNum.value);sync();draw();}
zoomNum.onchange=()=>{zoom=parseFloat(zoomNum.value);sync();draw();}

function savePreset(){
localStorage.setItem("lensPreset",JSON.stringify({distortion,zoom}));
}

function loadPreset(){
let p=JSON.parse(localStorage.getItem("lensPreset"));
if(p){distortion=p.distortion;zoom=p.zoom;sync();draw();}
}

document.getElementById("upload").onchange=e=>{
let file=e.target.files[0];
if(!file) return;

isVideo=file.type.startsWith("video");

let url=URL.createObjectURL(file);

if(isVideo){
video.src=url;
video.onloadedmetadata=()=>{
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

let track=video.captureStream().getVideoTracks()[0];
originalFPS=track.getSettings().frameRate||30;

video.play();
requestAnimationFrame(drawVideo);
};
}else{
let img=new Image();
img.onload=()=>{
canvas.width=img.width;
canvas.height=img.height;
sourceImage=img;
draw();
};
img.src=url;
}
};

function draw(){
if(isVideo||!sourceImage) return;
drawFrame(sourceImage);
}

function drawVideo(){
if(!video.paused && !video.ended){
drawFrame(video);
requestAnimationFrame(drawVideo);
}
}

function drawFrame(source){
let w=canvas.width;
let h=canvas.height;
let cx=w/2;
let cy=h/2;

let temp=document.createElement("canvas");
temp.width=w;
temp.height=h;
let tctx=temp.getContext("2d");
tctx.drawImage(source,0,0,w,h);

let imgData=tctx.getImageData(0,0,w,h);
let dst=ctx.createImageData(w,h);

for(let y=0;y<h;y++){
for(let x=0;x<w;x++){
let nx=(x-cx)/cx;
let ny=(y-cy)/cy;
let r=Math.sqrt(nx*nx+ny*ny);
let factor=1+distortion*r*r;

let srcX=Math.round(cx+nx*factor*cx/zoom);
let srcY=Math.round(cy+ny*factor*cy/zoom);

if(srcX>=0&&srcX<w&&srcY>=0&&srcY<h){
let si=(srcY*w+srcX)*4;
let di=(y*w+x)*4;
dst.data[di]=imgData.data[si];
dst.data[di+1]=imgData.data[si+1];
dst.data[di+2]=imgData.data[si+2];
dst.data[di+3]=255;
}
}
}

ctx.putImageData(dst,0,0);
}

let drawTimeout;
function scheduleDraw(){
clearTimeout(drawTimeout);
drawTimeout=setTimeout(draw,16);
}

function exportImage(){
let link=document.createElement("a");
link.download="fixed.png";
link.href=canvas.toDataURL();
link.click();
}

async function exportVideo(){
if(!isVideo) return;

bar.style.width="0%";

const stream=canvas.captureStream(originalFPS);

const recorder=new MediaRecorder(stream,{
mimeType:"video/webm;codecs=vp9",
videoBitsPerSecond:20000000
});

let chunks=[];
recorder.ondataavailable=e=>{
if(e.data.size) chunks.push(e.data);
};

recorder.onstop=()=>{
let blob=new Blob(chunks,{type:"video/webm"});
let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;
a.download="fixed_video.webm";
a.click();
bar.style.width="100%";
};

video.pause();
video.currentTime=0;
await video.play();

recorder.start();

function render(){
if(video.paused || video.ended){
recorder.stop();
return;
}

drawFrame(video);

let percent=(video.currentTime/video.duration)*100;
bar.style.width=percent+"%";

requestAnimationFrame(render);
}

requestAnimationFrame(render);
}
</script>

</body>
</html>
